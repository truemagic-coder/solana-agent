[tool.poetry]
name = "solana-agent"
version = "34.0.0"
description = "AI Agents for Solana"
authors = ["Bevan Hunt <bevan@bevanhunt.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://solana-agent.com"
repository = "https://github.com/truemagic-coder/solana-agent"
documentation = "https://docs.solana-agent.com"
keywords = ["solana", "solana ai", "solana agent", "ai", "ai agent", "ai agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "solana_agent" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast smoke tests for API, runtime, SDK, and tool surfaces",
    "integration: tests that cross process or external service boundaries",
    "live: tests that require live external services, credentials, or funds",
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
openai = "^2.33.0"
tiktoken = ">=0.12.0,<0.13.0"
pydantic = ">=2"
logfire = "^4.32.1"
typer = "^0.25.0"
rich = ">=13,<14.0"
pillow = "^12.2.0"
x402 = { version = "*", extras = ["httpx", "svm"] }
httpx = "^0.28.1"
based58 = "^0.1.1"
pyhpke = "^0.6.4"
fastmcp = "^3.2.4"
pymongo = "^4.17.0"
solders = "^0.27.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-github-actions-annotate-failures = "^0.4.0"
python-dotenv = ">=1.0,<2.0"
mongomock = "^4.3.0"
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
sphinx-autobuild = "^2025.08.25"
ruff = "^0.15.12"
respx = "^0.23.1"

[tool.poetry.scripts]
solana-agent = "solana_agent.cli:app"

[tool.poetry.plugins."solana_agent.plugins"]
mcp = "solana_agent.tools.mcp:get_plugin"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
